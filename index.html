<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070a" />
    <meta name="color-scheme" content="dark light" />
    <!-- Theme before first paint (tokens.css): the choice saved by the avatar menu, else the phone's setting. -->
    <script>
      let theme = null;
      try { theme = localStorage.getItem('theme'); } catch { /* storage blocked: follow the phone */ }
      document.documentElement.dataset.theme = theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    </script>
    <meta name="description" content="Fantasy league for our college ultimate team. Every dollar goes to the team fund." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23f5b700'/%3E%3Ccircle cx='12' cy='12' r='7.5' fill='none' stroke='%23c99400' stroke-width='1.5'/%3E%3Ccircle cx='12' cy='12' r='3' fill='%238cc8f2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=Big+Shoulders+Display:wght@800&display=swap" />
    <title>Tribe Fantasy</title>
  </head>

  </body>
</html>
