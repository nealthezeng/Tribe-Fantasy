name: Keep Supabase awake
# Free-tier projects pause after 7 days without activity. Twice a week, make one anon REST request that reaches
# Postgres. Anon has no table grants, so the expected answer is Postgres's own 42501 (permission denied); anything
# else (e.g. a paused project) fails the run, and GitHub emails the failure.
on:
  schedule:
    - cron: '17 9 * * 1,4'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          body=$(curl -sS "$URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $KEY")
          echo "$body"
          grep -q '"42501"' <<<"$body"
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
